name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Package DMG
        run: ./scripts/make-dmg.sh

      - name: Build legacy app bundle (macOS 12-13)
        run: ./legacy/build-app.sh

      - name: Package legacy DMG
        run: ./legacy/make-dmg.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FomoDoro.dmg
            FomoDoro-macOS12-13.dmg
